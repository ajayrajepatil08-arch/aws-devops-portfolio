name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get project code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f index.html
          test -f Dockerfile
          echo "Portfolio files checked successfully!"