
name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test website file
        run: |
          test -f index.html
          grep -qi "<html" index.html
          echo "Website HTML test passed!"

      - name: Test Dockerfile
        run: test -f Dockerfile

      - name: Build Docker image
        run: docker build -t my-portfolio .
